<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Mail Classifier</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>📧 Spam Mail Classifier</h1>
        <p>Natural Language Processing using Multinomial Naive Bayes</p>
    </header>

    <div class="ml-container">

        <form action="/predict" method="POST">

            <label for="message">
                Enter your Email or SMS
            </label>

            <textarea
                id="message"
                name="message"
                placeholder="Paste your email or SMS here..."
                required
            ></textarea>

            <button type="submit" class="btn-info">
                🚀 Detect Spam
            </button>

        </form>

    </div>

</div>

</body>
</html>
